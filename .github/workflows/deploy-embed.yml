name: Deploy embed.js

# Publishes dist/embed.js to the smart-banner CDN whenever it changes:
#   push on main -> production environment,  push on dev -> staging environment.
# A manual run picks its environment explicitly: the default branch moved from
# main to dev on 2026-08-24, which silently flipped an unqualified dispatch from
# production to staging. Safe direction, but implicit, and it would have flipped
# the other way just as quietly.
# Auth follows the org standard (OIDC role assumption, like plethore-whatsapp-bot) —
# no static AWS keys required.
#
# This repository is PUBLIC, so no infra identifiers (AWS account, role ARN,
# bucket, distribution id) live in this file. They are stored as *environment
# secrets* on each GitHub environment (keeps them out of this public repo's
# logs/config); the job binds to the environment matching the pushed branch, so
# the same secret names resolve to the right (prod vs staging) values:
#   Settings -> Environments -> {production|staging} -> Environment secrets
#     DEPLOY_ROLE_ARN            OIDC deploy role (modelled on plethore-whatsapp-bot-github-deploy-<env>)
#     EMBED_S3_BUCKET            bucket serving the env's smart-banner host
#     EMBED_CF_DISTRIBUTION_ID   CloudFront distribution id (E...)

on:
  push:
    branches: [main, dev]
    paths:
      - dist/embed.js
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment. production is refused unless dispatched from main."
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-embed-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    steps:
      - name: A production dispatch must come from main
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref_name != 'main'
        run: |
          echo "::error::refusing to publish '${{ github.ref_name }}' to production; dispatch from main"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload embed.js to S3 with a long max-age
        run: |
          aws s3 cp dist/embed.js "s3://${{ secrets.EMBED_S3_BUCKET }}/embed.js" \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront /embed.js
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.EMBED_CF_DISTRIBUTION_ID }}" \
            --paths "/embed.js"
