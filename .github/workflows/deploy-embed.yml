name: Deploy embed.js

# Publishes dist/embed.js to the smart-banner CDN whenever it changes on main.
# Auth follows the org standard (OIDC role assumption, like plethore-whatsapp-bot) —
# no static AWS keys required.
#
# This repository is PUBLIC, so no infra identifiers (AWS account, role ARN,
# bucket, distribution id) live in this file. Set them as repository variables:
#   Settings -> Secrets and variables -> Actions -> Variables
#     DEPLOY_ROLE_ARN            OIDC deploy role (modelled on plethore-whatsapp-bot-github-deploy-production)
#     EMBED_S3_BUCKET            bucket serving smart-banner.pletho.re
#     EMBED_CF_DISTRIBUTION_ID   CloudFront distribution id (E...)

on:
  push:
    branches: [main]
    paths:
      - dist/embed.js
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-embed
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload embed.js to S3 with a long max-age
        run: |
          aws s3 cp dist/embed.js "s3://${{ vars.EMBED_S3_BUCKET }}/embed.js" \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront /embed.js
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.EMBED_CF_DISTRIBUTION_ID }}" \
            --paths "/embed.js"
